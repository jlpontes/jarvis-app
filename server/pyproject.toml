[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis App: API (FastAPI + SQLite)"
authors = [
    { name = "jlpontes", email = "joaolmpneto@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
